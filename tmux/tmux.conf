set-environment -gF TMUX_PLUGIN_MANAGER_PATH_LOCAL '#{XDG_CONFIG_HOME}/tmux/plugins'

set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{TMUX_PLUGIN_MANAGER_PATH_LOCAL}/'

if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH_LOCAL}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH_LOCAL}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH_LOCAL}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH_LOCAL}/tpm/bin/install_plugins'
}

set -g default-terminal 'screen-256color'
set -ag terminal-overrides ',xterm-256color*:RGB'

set -g mouse on
set -g mode-keys vi

# Set prefix
#unbind C-b
#set -g prefix C-v
#bind C-v send-prefix

bind - split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind z display-popup -E "tms switch"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @catppuccin_flavor 'mocha'

run "${TMUX_PLUGIN_MANAGER_PATH_LOCAL}/catppuccin/tmux/catppuccin.tmux"

set -g default-terminal "tmux-256color"

# Window global/default configuration
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_status "no"
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_status 'no'

set -g status-left ""

# Status modules config
set -g @catppuccin_date_time_text " %d-%m %H:%M"

set -gF  status-right "#{@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

set -g @plugin 'tmux-plugins/tpm'

run "${TMUX_PLUGIN_MANAGER_PATH_LOCAL}/tpm/tpm"

